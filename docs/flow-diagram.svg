<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 340" width="980" height="340" role="img" aria-label="Ninada v5.0 24 kHz Native Studio VITS Indian English, Sanskrit, and Pan-Indic Architecture Blueprint">
  <defs>
    <style>
      .canvas { fill: #ffffff; }
      .frame { fill: none; stroke: #000000; stroke-width: 1.2; }
      .node { fill: #ffffff; stroke: #000000; stroke-width: 1.2; }
      .focal { fill: #000000; stroke: #000000; stroke-width: 1.4; }
      .wire { fill: none; stroke: #000000; stroke-width: 1.2; }
      .dashed { fill: none; stroke: #444444; stroke-width: 1.1; stroke-dasharray: 4 4; }
      .kicker { font-family: 'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10px; letter-spacing: 0.12em; fill: #444444; text-transform: uppercase; }
      .title { font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif; font-size: 14px; font-weight: 700; fill: #000000; }
      .focal-title { font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif; font-size: 14px; font-weight: 700; fill: #ffffff; }
      .sub { font-family: 'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10.5px; fill: #333333; }
      .focal-sub { font-family: 'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10.5px; fill: #e4e4e4; }
      .badge { font-family: 'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 9.8px; fill: #000000; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5 z" fill="#000000" />
    </marker>
  </defs>

  <rect class="canvas" x="0" y="0" width="980" height="340" rx="10" />
  <rect class="frame" x="14" y="14" width="952" height="312" rx="8" />

  <text class="kicker" x="32" y="38">NINADA v5.0 // 24 KHZ NATIVE PER-LANGUAGE STUDIO VITS SPECIALIST ARCHITECTURE (12 LANGUAGES · 24 VOICES)</text>
  <line x1="32" y1="48" x2="948" y2="48" stroke="#000000" stroke-width="1" stroke-opacity="0.18" />

  <!-- Stage 1: Script Input -->
  <rect class="node" x="32" y="88" width="172" height="126" rx="8" />
  <text class="kicker" x="46" y="110">01 / CLAUSE INPUT</text>
  <text class="title" x="46" y="132">Brahmic, Latin &amp; IAST</text>
  <text class="sub" x="46" y="153">SA · EN · HI · KN · MR · BN</text>
  <text class="sub" x="46" y="170">TA · TE · ML · GU · PA · OR</text>
  <text class="sub" x="46" y="187">Sentence Pause Anchor</text>

  <!-- Arrow 1->2 -->
  <line class="wire" x1="204" y1="151" x2="234" y2="151" marker-end="url(#arrow)" />

  <!-- Stage 2: Native Script & Brahmic Isomorphism -->
  <rect class="node" x="238" y="88" width="190" height="126" rx="8" />
  <text class="kicker" x="252" y="110">02 / NATIVE SCRIPT G2P</text>
  <text class="title" x="252" y="132">Zero-Dep Tokenizer</text>
  <text class="sub" x="252" y="153">12 Native Vocab Tables</text>
  <text class="sub" x="252" y="170">TA/PA/OR Isomorphism</text>
  <text class="sub" x="252" y="187">ML Chillu Decomposition</text>

  <!-- Arrow 2->3 (Tier 1) -->
  <line class="wire" x1="428" y1="136" x2="462" y2="136" marker-end="url(#arrow)" />
  <!-- Arrow 2->Tier 2 fallback -->
  <path class="dashed" d="M 333 214 L 333 268 L 462 268" marker-end="url(#arrow)" />

  <!-- Stage 3: Signature Inverted Solid-Black Focal Node -->
  <rect class="focal" x="466" y="72" width="256" height="136" rx="8" />
  <text class="focal-sub" x="482" y="94">03 / NATIVE STUDIO SPECIALISTS</text>
  <text class="focal-title" x="482" y="117">24x Native Studio VITS (ONNX)</text>
  <text class="focal-sub" x="482" y="139">12 Languages × Male &amp; Female</text>
  <text class="focal-sub" x="482" y="157">Stochastic Duration + Flow</text>
  <text class="focal-sub" x="482" y="175">27.9 MB W8A32+FP16 per Lang</text>
  <text class="focal-sub" x="482" y="193">MCD 3.27 dB · CacheStorage</text>

  <!-- Stage 3B: Tier 2 Zero-Dep Klatt -->
  <rect class="node" x="466" y="232" width="256" height="72" rx="8" />
  <text class="kicker" x="482" y="252">03B / TIER-2 ZERO-DEP FALLBACK</text>
  <text class="title" x="482" y="272">Cascade Klatt-Akshara Synth</text>
  <text class="sub" x="482" y="290">0.0 MB · 24 kHz Glottal + F1-F3</text>

  <!-- Arrow 3->4 -->
  <line class="wire" x1="722" y1="140" x2="754" y2="140" marker-end="url(#arrow)" />
  <path class="dashed" d="M 722 268 L 852 268 L 852 218" marker-end="url(#arrow)" />

  <!-- Stage 4: 24 kHz Multi-Scale HiFi-GAN + AudioWorklet -->
  <rect class="node" x="758" y="88" width="190" height="126" rx="8" />
  <text class="kicker" x="772" y="110">04 / 24 KHZ STREAM</text>
  <text class="title" x="772" y="132">HiFi-GAN + Worklet</text>
  <text class="sub" x="772" y="153">24,000 Hz Native Waveform</text>
  <text class="sub" x="772" y="170">Ring-Buffer AudioWorklet</text>
  <text class="sub" x="772" y="187">Zero-Underrun Clause PCM</text>

  <!-- Footer telemetry bar -->
  <text class="badge" x="32" y="314">RUNTIME: MULTI-CORE WASM SIMD + 24 KHZ AUDIOWORKLET + CACHESTORAGE + NODE.JS + PYTHON // MIT LICENSE</text>
</svg>
